<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Portfolio — projects, experience, and contact." />
    <title>Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="logo" href="#" data-site-title>Portfolio</a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
          <span class="sr-only">Menu</span>
          <span class="nav-toggle-bar"></span>
        </button>
        <nav id="site-nav" class="site-nav" aria-label="Primary">
          <ul class="nav-list"></ul>
        </nav>
      </div>
    </header>

    <main id="main">
      <section class="hero" id="top" aria-labelledby="hero-title">
        <div class="wrap hero-grid">
          <div class="hero-copy">
            <p class="eyebrow" data-hero-eyebrow></p>
            <h1 id="hero-title" data-hero-title></h1>
            <p class="hero-tagline" data-hero-tagline></p>
            <div class="hero-actions">
              <a class="btn btn-primary" data-hero-primary href="#contact"></a>
              <a class="btn btn-ghost" data-hero-secondary href="#projects"></a>
            </div>
          </div>
          <div class="hero-card" aria-hidden="true">
            <div class="hero-card-inner">
              <span class="hero-accent"></span>
              <p class="hero-card-label">Now</p>
              <p class="hero-card-text" data-hero-highlight></p>
            </div>
          </div>
        </div>
      </section>

      <section class="section" id="about" data-section="about">
        <div class="wrap narrow">
          <h2 class="section-title" data-about-heading></h2>
          <div class="prose" data-about-body></div>
        </div>
      </section>

      <section class="section section-alt" id="skills" data-section="skills">
        <div class="wrap">
          <h2 class="section-title" data-skills-heading></h2>
          <ul class="skill-grid" data-skills-list></ul>
        </div>
      </section>

      <section class="section" id="projects" data-section="projects">
        <div class="wrap">
          <h2 class="section-title" data-projects-heading></h2>
          <div class="project-grid" data-projects></div>
        </div>
      </section>

      <section class="section section-alt" id="experience" data-section="experience">
        <div class="wrap">
          <h2 class="section-title" data-experience-heading></h2>
          <ol class="timeline" data-experience></ol>
        </div>
      </section>

      <section class="section" id="education" data-section="education">
        <div class="wrap narrow">
          <h2 class="section-title" data-education-heading></h2>
          <ul class="education-list" data-education></ul>
        </div>
      </section>

      <section class="section cta-section" id="contact" data-section="contact">
        <div class="wrap narrow cta-inner">
          <h2 class="section-title" data-contact-heading></h2>
          <p class="cta-text" data-contact-lead></p>
          <ul class="contact-list" data-contact-links></ul>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="wrap footer-inner">
        <p data-footer-copy></p>
        <p class="footer-note">Built for <a href="https://pages.github.com/">GitHub Pages</a>.</p>
      </div>
    </footer>

    <script src="js/content.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
